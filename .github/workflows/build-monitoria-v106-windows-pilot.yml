name: MonitorIA Windows signed PILOT (manual entrypoint)

# Branch-only entrypoint. Main retains the ordinary 1.0.6 workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-pilot:
    if: github.repository == 'BigCorps/MonitorIA-Downloads' && github.ref == 'refs/heads/build/pdv-diagnostic-pilot'
    permissions:
      contents: write
    uses: ./.github/workflows/build-monitoria-pdv-diagnostic-pilot.yml
    secrets: inherit
