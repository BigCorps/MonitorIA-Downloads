name: Publish approved MonitorIA Protect 1.0.0

on:
  push:
    branches: [ci/protect-100-distribution]
    paths: [build-requests/protect-100-publish-approved.txt]

permissions:
  contents: write
  actions: read

concurrency:
  group: protect-100-approved-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'BigCorps/MonitorIA-Downloads' && github.actor == 'BigCorps'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: BigCorps/MonitorIA-Downloads
      RELEASE_ID: '461286675'
      RELEASE_TAG: protect-windows-1.0.0-homologacao
      RELEASE_COMMIT: 12108834b8ef283192e32635ec1840f14d0cbf7b
      RECOVERY_RUN: '46105615658'
      FILE_ID: '803144208'
      FILE_NAME: MonitorIA-Protect-1.0.0-Setup.exe
      CHECKSUM_ID: '803144209'
      FILE_SHA: f69e24b82de5dca24af76a12b0392c2527ff70a3ab5c6e68d43160eb01944b93
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false

      - name: Verify approval, attested draft, and exact signed installer
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq "publish-approved $RELEASE_ID $FILE_SHA" build-requests/protect-100-publish-approved.txt
          gh api "repos/$GH_REPO/actions/runs/$RECOVERY_RUN" | jq -e '
            .conclusion == "success" and .path == ".github/workflows/recover-protect-100-signed.yml"' >/dev/null
          cd "$(mktemp -d)"
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > release.json
          jq -e --arg tag "$RELEASE_TAG" --arg target "$RELEASE_COMMIT" --arg filename "$FILE_NAME" \
            --argjson file "$FILE_ID" --argjson manifest "$CHECKSUM_ID" --arg digest "sha256:$FILE_SHA" '
            (.draft | type == "boolean") and .tag_name == $tag and .target_commitish == $target
            and any(.assets[]; .id == $file and .name == $filename and .digest == $digest and .state == "uploaded")
            and any(.assets[]; .id == $manifest and .name == "SHA256SUMS.txt" and .state == "uploaded")' release.json >/dev/null
          gh api "repos/$GH_REPO/releases/assets/$FILE_ID" -H 'Accept: application/octet-stream' > "$FILE_NAME"
          gh api "repos/$GH_REPO/releases/assets/$CHECKSUM_ID" -H 'Accept: application/octet-stream' > SHA256SUMS.txt
          tr -d '\r' < SHA256SUMS.txt | grep -Fxq "$FILE_SHA  $FILE_NAME"
          printf '%s  %s\n' "$FILE_SHA" "$FILE_NAME" | sha256sum --check
          printf 'PROTECT_DRAFT=%s\n' "$(jq -r '.draft' release.json)" >> "$GITHUB_ENV"

      - name: Publish the existing draft and verify the anonymous download
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PROTECT_DRAFT" == true ]]; then
            gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false -F prerelease=false \
              -f tag_name="$RELEASE_TAG" -f make_latest=false -f name='MonitorIA Protect 1.0.0' >/dev/null
          fi
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" | jq -e --arg digest "sha256:$FILE_SHA" --argjson asset "$FILE_ID" '
            .draft == false and .prerelease == false and any(.assets[]; .id == $asset and .digest == $digest)' >/dev/null
          cd "$(mktemp -d)"
          link="https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/$FILE_NAME"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --retry 4 --retry-all-errors --max-time 40 --output "$FILE_NAME" "$link"
          printf '%s  %s\n' "$FILE_SHA" "$FILE_NAME" | sha256sum --check
          printf '%s\n' "$link"
