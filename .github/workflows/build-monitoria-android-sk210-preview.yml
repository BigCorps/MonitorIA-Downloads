name: MonitorIA Android SK210 preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monitoria-android-sk210-preview
  cancel-in-progress: false
env:
  # Reviewed private source. Changing it requires review; no mutable branch input.
  MONITORIA_SOURCE_SHA: d6cc3dbb94827423f7eedfce3c36f723999ce677
  EXPECTED_VERSION_CODE: '1'
jobs:
  android-preview:
    if: github.repository == 'BigCorps/MonitorIA-Downloads' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: android-private-signing
    permissions:
      contents: write
    env:
      MONITORIA_SOURCE_DIR: ${{ github.workspace }}/_monitoria_source
      EXPECTED_CERT_SHA256: ${{ vars.MONITORIA_ANDROID_CERT_SHA256 }}
    steps:
      - name: Check access and persistent signing bindings before checkout or SDK
        env:
          MONITORIA_PRIVATE_SOURCE_TOKEN: ${{ secrets.MONITORIA_PRIVATE_SOURCE_TOKEN }}
          MONITORIA_ANDROID_SIGNING_STORE_B64: ${{ secrets.MONITORIA_ANDROID_SIGNING_STORE_B64 }}
          MONITORIA_ANDROID_STORE_PASSWORD: ${{ secrets.MONITORIA_ANDROID_STORE_PASSWORD }}
          MONITORIA_ANDROID_KEY_ALIAS: ${{ secrets.MONITORIA_ANDROID_KEY_ALIAS }}
          MONITORIA_ANDROID_KEY_PASSWORD: ${{ secrets.MONITORIA_ANDROID_KEY_PASSWORD }}
          MONITORIA_ANDROID_CERT_SHA256: ${{ vars.MONITORIA_ANDROID_CERT_SHA256 }}
        run: |
          python3 - <<'PY'
          import json,os,re,urllib.request,urllib.error
          names=('MONITORIA_PRIVATE_SOURCE_TOKEN','MONITORIA_ANDROID_SIGNING_STORE_B64','MONITORIA_ANDROID_STORE_PASSWORD','MONITORIA_ANDROID_KEY_ALIAS','MONITORIA_ANDROID_KEY_PASSWORD','MONITORIA_ANDROID_CERT_SHA256')
          missing=[n for n in names if not os.environ.get(n)]
          if missing:raise SystemExit('Missing bindings (names only): '+', '.join(missing))
          if not re.fullmatch(r'[a-fA-F0-9]{64}',os.environ['MONITORIA_ANDROID_CERT_SHA256'].replace(':','').strip()):raise SystemExit('Invalid persistent certificate fingerprint')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          try:
              req=urllib.request.Request('https://api.github.com/repos/BigCorps/MonitorIA',headers={'Authorization':'Bearer '+os.environ['MONITORIA_PRIVATE_SOURCE_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.build_opener(NoRedirect).open(req,timeout=20) as response:source=json.load(response)
          except urllib.error.HTTPError as error:raise SystemExit(f'Private source read failed (HTTP {error.code}); check the existing read-only source token') from None
          except Exception:raise SystemExit('Authorized read access to private MonitorIA is required') from None
          if source.get('private') is not True or source.get('full_name')!='BigCorps/MonitorIA':raise SystemExit('MonitorIA source must be private; no checkout or build performed')
          PY
      - name: Checkout only the pinned private source (no persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: BigCorps/MonitorIA
          ref: ${{ env.MONITORIA_SOURCE_SHA }}
          token: ${{ secrets.MONITORIA_PRIVATE_SOURCE_TOKEN }}
          path: _monitoria_source
          persist-credentials: false
          show-progress: false
      - name: Validate source, existing Android identity and release inventory
        env:
          SOURCE_TOKEN: ${{ secrets.MONITORIA_PRIVATE_SOURCE_TOKEN }}
          PUBLIC_TOKEN: ${{ github.token }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/android-preview-private"
          if ! python3 "$MONITORIA_SOURCE_DIR/android-agent/tools/downloads-preview.py" preflight > "$RUNNER_TEMP/android-preview-private/preflight-console.log" 2>&1; then
            echo "::error::Source, baseline identity or release inventory preflight failed; no build performed."
            exit 1
          fi
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Compile, lint, interop, licenses and isolated PostgreSQL (private diagnostics only)
        run: |
          if ! python3 "$MONITORIA_SOURCE_DIR/android-agent/tools/downloads-preview.py" validate > "$RUNNER_TEMP/android-preview-private/validate-console.log" 2>&1; then
            echo "::error::Android validation failed; private diagnostics are not uploaded."
            exit 1
          fi
      - name: Reserve disposable runner disk and enable KVM
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_OS" = Linux
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk
          python3 -c "import shutil; assert shutil.disk_usage('/home/runner').free >= 10*1024**3, 'Runner needs 10 GiB before emulator'"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 13 synthetic lifecycle, RTSP, offline queue and real reboot
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          emulator-boot-timeout: 180
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048
          script: |
            python3 "$MONITORIA_SOURCE_DIR/android-agent/tools/downloads-preview.py" instrumented > "$RUNNER_TEMP/android-preview-private/instrumented-console.log" 2>&1 || { echo "::error::Android instrumentation failed; no APK will be published."; exit 1; }
      - name: Sign with the existing persistent key and verify APK
        env:
          MONITORIA_ANDROID_SIGNING_STORE_B64: ${{ secrets.MONITORIA_ANDROID_SIGNING_STORE_B64 }}
          MONITORIA_ANDROID_STORE_PASSWORD: ${{ secrets.MONITORIA_ANDROID_STORE_PASSWORD }}
          MONITORIA_ANDROID_KEY_ALIAS: ${{ secrets.MONITORIA_ANDROID_KEY_ALIAS }}
          MONITORIA_ANDROID_KEY_PASSWORD: ${{ secrets.MONITORIA_ANDROID_KEY_PASSWORD }}
        run: |
          if ! python3 "$MONITORIA_SOURCE_DIR/android-agent/tools/downloads-preview.py" sign > "$RUNNER_TEMP/android-preview-private/sign-console.log" 2>&1; then
            echo "::error::Persistent signature, certificate or APK verification failed; no publication."
            exit 1
          fi
      - name: Publish only APK, manifest and checksums as separate non-default preview
        env:
          SOURCE_TOKEN: ${{ secrets.MONITORIA_PRIVATE_SOURCE_TOKEN }}
          PUBLIC_TOKEN: ${{ github.token }}
        run: |
          if ! python3 "$MONITORIA_SOURCE_DIR/android-agent/tools/downloads-preview.py" publish > "$RUNNER_TEMP/android-preview-private/publish-console.log" 2>&1; then
            echo "::error::Preview publication stopped; no automatic overwrite or retry."
            exit 1
          fi
          echo "Android preview verified. Download metadata is in the job summary."
      - name: Remove private source, logs, signing material and temporary packages
        if: always()
        run: rm -rf -- "$MONITORIA_SOURCE_DIR" "$RUNNER_TEMP/android-preview-private" "$RUNNER_TEMP/android-preview-out"

