name: MonitorIA Android SK210 preview
on:
  workflow_dispatch:
    inputs:
      expected_workflow_sha:
        description: Optional immutable SHA guard for the reviewed dispatcher
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: monitoria-android-sk210-preview
  cancel-in-progress: false
env:
  # Reviewed private source. Changing it requires review; no mutable branch input.
  MONITORIA_SOURCE_SHA: 875d378e0ef5969417eb42c40cdbac4cd69416d7
  EXPECTED_VERSION_CODE: '8'
jobs:
  android-preview:
    if: github.repository == 'BigCorps/MonitorIA-Downloads' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: android-private-signing
    permissions:
      contents: write
    env:
      MONITORIA_SOURCE_DIR: ${{ github.workspace }}/_monitoria_source
      EXPECTED_CERT_SHA256: ${{ vars.MONITORIA_ANDROID_CERT_SHA256 }}
    steps:
      - name: Verify reviewed dispatcher SHA before secrets or checkout
        env:
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
        run: |
          if [ -n "$EXPECTED_WORKFLOW_SHA" ] && [ "$EXPECTED_WORKFLOW_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Workflow SHA changed after authorization; no checkout or build."
            exit 1
          fi
      - name: Check access and persistent signing bindings before checkout or SDK
        env:
          MONITORIA_PRIVATE_SOURCE_TOKEN: ${{ secrets.MONITORIA_PRIVATE_SOURCE_TOKEN }}
          MONITORIA_ANDROID_SIGNING_STORE_B64: ${{ secrets.MONITORIA_ANDROID_SIGNING_STORE_B64 }}
          MONITORIA_ANDROID_STORE_PASSWORD: ${{ secrets.MONITORIA_ANDROID_STORE_PASSWORD }}
          MONITORIA_ANDROID_KEY_ALIAS: ${{ secrets.MONITORIA_ANDROID_KEY_ALIAS }}
          MONITORIA_ANDROID_KEY_PASSWORD: ${{ secrets.MONITORIA_ANDROID_KEY_PASSWORD }}
          MONITORIA_ANDROID_CERT_SHA256: ${{ vars.MONITORIA_ANDROID_CERT_SHA256 }}
        run: |
          python3 - <<'PY'
          import json,os,re,urllib.request,urllib.error
          names=('MONITORIA_PRIVATE_SOURCE_TOKEN','MONITORIA_ANDROID_SIGNING_STORE_B64','MONITORIA_ANDROID_STORE_PASSWORD','MONITORIA_ANDROID_KEY_ALIAS','MONITORIA_ANDROID_KEY_PASSWORD','MONITORIA_ANDROID_CERT_SHA256')
          missing=[n for n in names if not os.environ.get(n)]
          if missing:raise SystemExit('Missing bindings (names only): '+', '.join(missing))
          if not re.fullmatch(r'[a-fA-F0-9]{64}',os.environ['MONITORIA_ANDROID_CERT_SHA256'].replace(':','').strip()):raise SystemExit('Invalid persistent certificate fingerprint')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          try:
              req=urllib.request.Request('https://api.github.com/repos/BigCorps/MonitorIA',headers={'Authorization':'Bearer '+os.environ['MONITORIA_PRIVATE_SOURCE_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.build_opener(NoRedirect).open(req,timeout=20) as response:source=json.load(response)
          except urllib.error.HTTPError as error:raise SystemExit(f'Private source read failed (HTTP {error.code}); check the existing read-only source token') from None
          except Exception:raise SystemExit('Authorized read access to private MonitorIA is required') from None
          if source.get('private') is not True or source.get('full_name')!='BigCorps/MonitorIA':raise SystemExit('MonitorIA source must be private; no checkout or build performed')
          PY
      - name: Checkout only the pinned private source (no persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: BigCorps/MonitorIA
          ref: ${{ env.MONITORIA_SOURCE_SHA }}
          token: ${{ secrets.MONITORIA_PRIVATE_SOURCE_TOKEN }}
          path: _monitoria_source
          persist-credentials: false
          show-progress: false
      - name: Validate source, existing Android identity and release inventory
        env:
          SOURCE_TOKEN: ${{ secrets.MONITORIA_PRIVATE_SOURCE_TOKEN }}
          PUBLIC_TOKEN: ${{ github.token }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/android-preview-private"
          if ! python3 "$MONITORIA_SOURCE_DIR/android-agent/tools/downloads-preview.py" preflight > "$RUNNER_TEMP/android-preview-private/preflight-console.log" 2>&1; then
            python3 "$MONITORIA_SOURCE_DIR/android-agent/tools/downloads-preview.py" status
            echo "::error::Android preflight failed. Only allowlisted stage was displayed; no private logs or build released."
            exit 1
          fi
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Compile, lint, interop, licenses and isolated PostgreSQL (private diagnostics only)
        run: |
          if ! python3 "$MONITORIA_SOURCE_DIR/android-agent/tools/downloads-preview.py" validate > "$RUNNER_TEMP/android-preview-private/validate-console.log" 2>&1; then
            echo "::error::Android validation failed; private diagnostics are not uploaded."
          # Public runner logs must never reveal private source/test output.
          # Transport only encrypted diagnostics, with a public RSA key. No
          # signing credential is present in the compile step.
          python3 - <<'PY'
          import os, pathlib, base64, tempfile, subprocess, zlib, hmac, hashlib, json
          directory=pathlib.Path(os.environ['RUNNER_TEMP'])/'android-preview-private'
          order=['preview-driver-tests','dependencies','node-interop','android-gates','licenses','postgres','postgres-pdv']
          current=next((name for name in reversed(order) if (directory/(name+'.log')).is_file()),'unknown')
          print('::notice::Android validation gate: '+current)
          log=directory/(current+'.log')
          if not log.is_file():raise SystemExit()
          # Deliberately minimal public diagnostic: count/category/line only,
          # NEVER private filenames, source lines, exception text, URLs or keys.
          import re
          evidence=log.read_text(errors='replace')
          compile_spots=[]
          for row in evidence.splitlines():
              if not row.lstrip().startswith(('e:','error:')):continue
              match=re.search(r'\\.kt:(\\d+):(\\d+)',row)
              if match:
                  kind='other'
                  for word,label in [('unresolved reference','unresolved'),('type mismatch','type'),('expecting','syntax'),
                                     ('cannot infer','inference'),('overload resolution','overload'),
                                     ('none of the following candidates','overload')]:
                      if word in row.lower():kind=label;break
                  compile_spots.append((int(match.group(1)),kind))
          if current=='android-gates':
              for line,kind in compile_spots[:5]:
                  print('::notice::Android compiler diagnostic line='+str(line)+' category='+kind)
              test_names=['handshakeAndPublishEmitPhasesWithoutSecrets','failureGuidanceDistinguishesStagesWithoutExposingRawErrors']
              for name in test_names:
                  if re.search(re.escape(name)+r'.*FAILED',evidence):
                      print('::notice::Synthetic RTMP regression failed='+name)
              print('::notice::Android gate diagnostic count='+str(len(compile_spots)))
          data=zlib.compress(('GATE='+current+'\n').encode()+log.read_bytes()[-32000:],9)
          aes=os.urandom(32);iv=os.urandom(16)
          pub="""-----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAsSkZjR1srmcJ4LHVya5j
          QoFHn5akgVhGseU9JLksabJKImzRk7TdrpcHWPPAcWKlks209x5I68fV1FacBwhj
          h/cctzfCssygP0YbP+QZQo9+ESq7eEO3VzNgbfYQrHILbijLJeflzyeiDh3rnWeq
          36tOAd8/QjbzUTqifYPuUyY3m55MwAloYHADWzP6v8mDVTg7hoyjxvGr8o57o7On
          Htg5nNyMou7SyHppdU8MZ+MAGtcycFEgAkLh9cxJ4+RqEllptCMPArpGAn0jN7Eh
          rIALfauO3/5BghOfbahy5rH4GrelZExwAocLflgHD12/kewiawFfBvfOxGABkFMv
          1wIDAQAB
          -----END PUBLIC KEY-----"""
          with tempfile.TemporaryDirectory() as tmp:
              tmp=pathlib.Path(tmp)
              (tmp/'public.pem').write_text(pub)
              (tmp/'key.bin').write_bytes(aes)
              (tmp/'source.bin').write_bytes(data)
              subprocess.run(['openssl','enc','-aes-256-ctr','-K',aes.hex(),'-iv',iv.hex(),'-in',str(tmp/'source.bin'),'-out',str(tmp/'encrypted.bin')],check=True,stdout=subprocess.DEVNULL)
              subprocess.run(['openssl','pkeyutl','-encrypt','-pubin','-inkey',str(tmp/'public.pem'),'-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256','-in',str(tmp/'key.bin'),'-out',str(tmp/'wrapped.bin')],check=True,stdout=subprocess.DEVNULL)
              encrypted=(tmp/'encrypted.bin').read_bytes()
              report={'scheme':'RSA-OAEP-SHA256+AES-256-CTR+HMAC-SHA256+zlib','key':base64.b64encode((tmp/'wrapped.bin').read_bytes()).decode(),'iv':base64.b64encode(iv).decode(),'mac':hmac.new(aes,iv+encrypted,hashlib.sha256).hexdigest(),'data':base64.b64encode(encrypted).decode()}
              print('ENCRYPTED_ANDROID_GATE_BEGIN')
              print(json.dumps(report,separators=(',',':')))
              print('ENCRYPTED_ANDROID_GATE_END')
          PY
            exit 1
          fi
      - name: Reserve disposable runner disk and enable KVM
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_OS" = Linux
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk
          python3 -c "import shutil; assert shutil.disk_usage('/home/runner').free >= 10*1024**3, 'Runner needs 10 GiB before emulator'"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 13 synthetic lifecycle, RTSP, offline queue and real reboot
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          emulator-boot-timeout: 180
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048
          script: |
            python3 "$MONITORIA_SOURCE_DIR/android-agent/tools/downloads-preview.py" instrumented > "$RUNNER_TEMP/android-preview-private/instrumented-console.log" 2>&1 || { echo "::error::Android instrumentation failed; no APK will be published."; exit 1; }
      - name: Sign with the existing persistent key and verify APK
        env:
          MONITORIA_ANDROID_SIGNING_STORE_B64: ${{ secrets.MONITORIA_ANDROID_SIGNING_STORE_B64 }}
          MONITORIA_ANDROID_STORE_PASSWORD: ${{ secrets.MONITORIA_ANDROID_STORE_PASSWORD }}
          MONITORIA_ANDROID_KEY_ALIAS: ${{ secrets.MONITORIA_ANDROID_KEY_ALIAS }}
          MONITORIA_ANDROID_KEY_PASSWORD: ${{ secrets.MONITORIA_ANDROID_KEY_PASSWORD }}
        run: |
          if ! python3 "$MONITORIA_SOURCE_DIR/android-agent/tools/downloads-preview.py" sign > "$RUNNER_TEMP/android-preview-private/sign-console.log" 2>&1; then
            python3 "$MONITORIA_SOURCE_DIR/android-agent/tools/downloads-preview.py" status
            echo "::error::Android signing gate failed; sanitized substage/counts above. No publication."
            exit 1
          fi
      - name: Publish only APK, manifest and checksums as separate non-default preview
        env:
          SOURCE_TOKEN: ${{ secrets.MONITORIA_PRIVATE_SOURCE_TOKEN }}
          PUBLIC_TOKEN: ${{ github.token }}
        run: |
          if ! python3 "$MONITORIA_SOURCE_DIR/android-agent/tools/downloads-preview.py" publish > "$RUNNER_TEMP/android-preview-private/publish-console.log" 2>&1; then
            echo "::error::Preview publication stopped; no automatic overwrite or retry."
            exit 1
          fi
          echo "Android preview verified. Download metadata is in the job summary."
      - name: Remove private source, logs, signing material and temporary packages
        if: always()
        run: rm -rf -- "$MONITORIA_SOURCE_DIR" "$RUNNER_TEMP/android-preview-private" "$RUNNER_TEMP/android-preview-out"

