name: MonitorIA VIP Mosaico Windows unsigned internal preview

on:
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Verify real GitHub HTTP access and the empty draft without compiling
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: monitoria-vip-mosaic-windows-unsigned
  cancel-in-progress: false

env:
  MONITORIA_SOURCE_SHA: 2e7ed0cd2d7fa322802e8f26f22c70f19f54ab1d

jobs:
  distribution-preflight:
    if: >-
      github.repository == 'BigCorps/MonitorIA-Downloads' && github.event.repository.private == false &&
      (github.ref == 'refs/heads/main' ||
       (github.ref == 'refs/heads/codex/vip-mosaic-unsigned-homologation' && github.actor == 'BigCorps' && github.triggering_actor == 'BigCorps'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          show-progress: false

      - name: Verify GitHub media types and the residual draft before Windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/windows-vip-mosaic-draft.sh preflight

  windows-preview:
    needs: distribution-preflight
    if: inputs.preflight_only == false
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check private-source read binding
        env:
          MONITORIA_PRIVATE_SOURCE_TOKEN: ${{ secrets.MONITORIA_PRIVATE_SOURCE_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MONITORIA_PRIVATE_SOURCE_TOKEN)) {
            throw "Missing binding: MONITORIA_PRIVATE_SOURCE_TOKEN"
          }

      - name: Checkout public build tools
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          show-progress: false

      - name: Check fixed draft tag availability
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/windows-vip-mosaic-draft.sh check

      - name: Verify the source repository is private
        env:
          GH_TOKEN: ${{ secrets.MONITORIA_PRIVATE_SOURCE_TOKEN }}
        run: |
          $visible = gh api repos/BigCorps/MonitorIA --jq '.private' 2>$null
          if ($LASTEXITCODE -ne 0 -or $visible -cne 'true') { throw "Private source access failed" }

      - name: Checkout reviewed private source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: BigCorps/MonitorIA
          ref: ${{ env.MONITORIA_SOURCE_SHA }}
          token: ${{ secrets.MONITORIA_PRIVATE_SOURCE_TOKEN }}
          path: private-src
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Verify public compiler diagnostics redaction
        run: ./tools/test-windows-vip-native-diagnostics.ps1

      - name: Build and test Windows preview and package it without signing
        run: ./tools/windows-vip-mosaic-build.ps1

      - name: Stage the unsigned preview in an access-controlled draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/windows-vip-mosaic-draft.sh stage
