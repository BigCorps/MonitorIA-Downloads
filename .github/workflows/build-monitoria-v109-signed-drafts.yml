name: MonitorIA 1.0.9 — validate private source and signed drafts
on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        description: Select channels (validation always runs)
        options: [validation, all, windows, linux, android]
        default: validation
      acknowledge_drafts:
        type: boolean
        description: Authorize native builds and signing, unpublished drafts only
        default: false
permissions:
  contents: read
concurrency:
  group: monitoria-v109-candidates
  cancel-in-progress: false
env:
  MONITORIA_SOURCE_SHA: 339046a946a884d898fb9120c7e109b4c5798c35
jobs:
  validate:
    if: github.repository == 'BigCorps/MonitorIA-Downloads' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check draft availability and manifest signing key before native builds
        if: inputs.acknowledge_drafts && inputs.channel != 'validation'
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_CHANNEL: ${{ inputs.channel }}
          MANIFEST_SIGNING_KEY_B64: ${{ secrets.MONITORIA_AGENT_RELEASE_SIGNING_KEY_B64 }}
          TRUSTED_RELEASE_FINGERPRINT: ${{ vars.MONITORIA_AGENT_RELEASE_KEY_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$MANIFEST_SIGNING_KEY_B64" ]]; then
            echo "::error::Missing Actions secret MONITORIA_AGENT_RELEASE_SIGNING_KEY_B64 in MonitorIA-Downloads. Provision the existing trusted manifest key; do not generate a replacement or expose the private source."
            exit 1
          fi
          if [[ ! "$TRUSTED_RELEASE_FINGERPRINT" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Missing or invalid Actions variable MONITORIA_AGENT_RELEASE_KEY_SHA256."
            exit 1
          fi
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          if ! printf '%s' "$MANIFEST_SIGNING_KEY_B64" | base64 --decode > "$key" 2>/dev/null; then
            echo "::error::Manifest signing secret is not valid base64."
            exit 1
          fi
          if ! actual="$(openssl pkey -in "$key" -passin pass: -pubout -outform DER 2>/dev/null | sha256sum | cut -d' ' -f1)"; then
            echo "::error::Manifest signing secret does not contain a readable unencrypted private key."
            exit 1
          fi
          if [[ "$actual" != "$TRUSTED_RELEASE_FINGERPRINT" ]]; then
            echo "::error::Manifest signing key fingerprint differs from the trusted release key."
            exit 1
          fi
          if ! openssl pkey -in "$key" -passin pass: -text_pub -noout 2>/dev/null | grep -q 'ED25519 Public-Key:'; then
            echo "::error::Expected the existing Ed25519 manifest signing key."
            exit 1
          fi
          echo "Trusted manifest signing key verified."
          case "$SELECTED_CHANNEL" in
            all) channels=(windows linux-x64 linux-arm64 android-pdv android-conventional) ;;
            windows) channels=(windows) ;;
            linux) channels=(linux-x64 linux-arm64) ;;
            android) channels=(android-pdv android-conventional) ;;
            *) exit 2 ;;
          esac
          releases="$(gh api --method GET "repos/$GITHUB_REPOSITORY/releases" -f per_page=100 --paginate --jq '.[].tag_name')"
          for channel in "${channels[@]}"; do
            tag="rc-v109-$(printf '%.12s' "$MONITORIA_SOURCE_SHA")-$channel"
            refs="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq ".[].ref")"
            if grep -Fxq "$tag" <<< "$releases" || grep -Fxq "refs/tags/$tag" <<< "$refs"; then
              echo "::error::Candidate $channel already exists; use the existing draft or rerun only failed jobs."
              exit 1
            fi
          done
      - name: Require private source
        env:
          GH_TOKEN: ${{ secrets.MONITORIA_PRIVATE_SOURCE_TOKEN }}
        run: test "$(gh api repos/BigCorps/MonitorIA --jq .private)" = true
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: BigCorps/MonitorIA
          ref: ${{ env.MONITORIA_SOURCE_SHA }}
          token: ${{ secrets.MONITORIA_PRIVATE_SOURCE_TOKEN }}
          path: private-src
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Typecheck and targeted shared-core and PDV regressions
        working-directory: private-src
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MONITORIA_SOURCE_SHA"
          umask 077
          log="$RUNNER_TEMP/v109-validation.log"
          trap 'rm -f "$log"' EXIT
          run_gate() {
            name="$1"; shift
            if ! "$@" >"$log" 2>&1; then
              echo "::error::Private validation gate failed: $name"
              exit 1
            fi
            echo "Passed: $name"
          }
          run_gate dependencies npm ci --no-audit --no-fund
          run_gate agent-typecheck ./node_modules/.bin/tsc --noEmit -p agent/tsconfig.json
          run_gate web-typecheck ./node_modules/.bin/tsc --noEmit
          run_gate regressions node --import tsx --test test/agent-v109-*.test.ts test/agent-0103-early-pinning.test.ts test/agent-0103-video-integrity.test.ts test/agent-0103-timeline-segment-timing.test.ts test/agent-v107-media.test.ts test/agent-v108-rtmp-setup.test.ts test/agent-v108-rtmp-database.test.ts test/pdv-sale-clip-plan.test.ts test/pdv-sale-clip-security.test.ts
      - name: Remove private checkout
        if: always()
        run: rm -rf private-src
  windows:
    needs: validate
    if: inputs.acknowledge_drafts && (inputs.channel == 'all' || inputs.channel == 'windows')
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: BigCorps/MonitorIA
          ref: ${{ env.MONITORIA_SOURCE_SHA }}
          token: ${{ secrets.MONITORIA_PRIVATE_SOURCE_TOKEN }}
          path: private-src
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify bindings and install pinned baseline Bun
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
          MANIFEST_SIGNING_KEY_B64: ${{ secrets.MONITORIA_AGENT_RELEASE_SIGNING_KEY_B64 }}
          TRUSTED_RELEASE_FINGERPRINT: ${{ vars.MONITORIA_AGENT_RELEASE_KEY_SHA256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @('ESIGNER_USERNAME','ESIGNER_PASSWORD','ESIGNER_CREDENTIAL_ID','ESIGNER_TOTP_SECRET','MANIFEST_SIGNING_KEY_B64','TRUSTED_RELEASE_FINGERPRINT')
          foreach ($name in $required) { if (![Environment]::GetEnvironmentVariable($name)) { throw "Missing binding: $name" } }
          $archive = Join-Path $env:RUNNER_TEMP 'bun.zip'
          Invoke-WebRequest 'https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-windows-x64-baseline.zip' -OutFile $archive
          if ((Get-FileHash $archive).Hash -ne '538f9c846355d9e847b2671bc00c47da4229a0befb24df3282b739770f3b475f') { throw 'Bun hash mismatch' }
          Expand-Archive $archive -DestinationPath "$env:RUNNER_TEMP/bun"
          $bun = Get-ChildItem "$env:RUNNER_TEMP/bun" -Recurse -Filter bun.exe | Select-Object -First 1
          if (!$bun -or (& $bun.FullName --version) -ne '1.3.14') { throw 'Wrong Bun version' }
          $bun.DirectoryName | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Compile Windows and Store candidates and verify discovery
        env:
          GH_TOKEN: ${{ secrets.MONITORIA_PRIVATE_SOURCE_TOKEN }}
          DOWNLOADS_READ_TOKEN: ${{ github.token }}
        working-directory: private-src
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $log = Join-Path $env:RUNNER_TEMP 'v109-windows-private.log'
          try {
            & {
              if ((git rev-parse HEAD).Trim() -ne $env:MONITORIA_SOURCE_SHA) { throw 'Source SHA mismatch' }
              npm ci --no-audit --no-fund
              ./node_modules/.bin/tsc.cmd --noEmit -p agent/tsconfig.json
              node --import tsx --test test/agent-windows-dvr-channels.test.ts test/agent-0106-windows-legacy-auto.test.ts test/agent-onvif-incomplete-dvr-channels.test.ts
              $env:GITHUB_WORKSPACE = (Get-Location).Path
              & pwsh -NoProfile -NonInteractive -File ./scripts/release-agent-v107-windows.ps1 prepare -ReleaseVersion 1.0.9
              if ($LASTEXITCODE -ne 0) { throw 'Prepare failed' }
            } *> $log
          } catch { throw 'Private Windows compilation or tests failed.' }
          finally { Remove-Item $log -Force -ErrorAction SilentlyContinue }
      - uses: sslcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b
        with:
          command: --version
          environment_name: PROD
      - name: Sign components and package both installers
        working-directory: private-src
        env:
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $log = Join-Path $env:RUNNER_TEMP 'v109-sign-private.log'
          try {
            & {
              $env:GITHUB_WORKSPACE = (Get-Location).Path
              $env:MONITORIA_SIGN_CONTEXT = 'windows-247-components'
              New-Item -ItemType Directory sign-stage-signed | Out-Null
              foreach ($name in @('monitoria-agent.exe','monitoria-dpapi.exe','monitoria-tray.exe','monitoria-service.exe','mediamtx.exe','monitoria-desktop.exe','monitoria-store-launcher.exe')) {
                Copy-Item "sign-stage/$name" "sign-stage-signed/$name"
                & pwsh -NoProfile -NonInteractive -File ./scripts/sign-inno-authenticode.ps1 "sign-stage-signed/$name"
                if ($LASTEXITCODE -ne 0) { throw 'Component signature failed' }
              }
              & pwsh -NoProfile -NonInteractive -File ./scripts/release-agent-v107-windows.ps1 package -ReleaseVersion 1.0.9
              if ($LASTEXITCODE -ne 0) { throw 'Package failed' }
            } *> $log
          } catch { throw 'Private Windows signature or upgrade validation failed.' }
          finally { Remove-Item $log -Force -ErrorAction SilentlyContinue }
      - name: Stage signed Windows and Store installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_SIGNING_KEY_B64: ${{ secrets.MONITORIA_AGENT_RELEASE_SIGNING_KEY_B64 }}
          TRUSTED_RELEASE_FINGERPRINT: ${{ vars.MONITORIA_AGENT_RELEASE_KEY_SHA256 }}
        run: bash tools/v109-stage-draft.sh windows private-src/release-windows
      - name: Remove private checkout
        if: always()
        run: Remove-Item private-src -Recurse -Force -ErrorAction SilentlyContinue
  linux:
    needs: validate
    if: inputs.acknowledge_drafts && (inputs.channel == 'all' || inputs.channel == 'linux')
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x64, runner: ubuntu-24.04, bridge: amd64}
          - {arch: arm64, runner: ubuntu-24.04-arm, bridge: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: BigCorps/MonitorIA
          ref: ${{ env.MONITORIA_SOURCE_SHA }}
          token: ${{ secrets.MONITORIA_PRIVATE_SOURCE_TOKEN }}
          path: private-src
          persist-credentials: false
          show-progress: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
          no-cache: true
      - name: Compile and test systemd upgrade on native architecture
        working-directory: private-src
        env:
          ARCH: ${{ matrix.arch }}
          BRIDGE: ${{ matrix.bridge }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MONITORIA_SOURCE_SHA"
          umask 077
          log="$RUNNER_TEMP/v109-linux-private.log"
          trap 'rm -f "$log"' EXIT
          trap 'echo "::error::Private Linux build or upgrade failed"' ERR
          (
            set -euo pipefail
            curl -fsSL "https://github.com/BigCorps/MonitorIA-Downloads/releases/download/agent-v1.0.6/monitoria-agent-linux-$ARCH.tar.gz" -o "$RUNNER_TEMP/baseline.tar.gz"
            curl -fsSL "https://github.com/bluenviron/mediamtx/releases/download/v1.21.1/mediamtx_v1.21.1_linux_$BRIDGE.tar.gz" -o "$RUNNER_TEMP/bridge.tar.gz"
            bash packaging/linux/package-v109.sh "$ARCH" "$RUNNER_TEMP/baseline.tar.gz" "$RUNNER_TEMP/bridge.tar.gz" "$RUNNER_TEMP/final"
            mkdir -p "$RUNNER_TEMP/old" "$RUNNER_TEMP/new"
            tar xf "$RUNNER_TEMP/baseline.tar.gz" -C "$RUNNER_TEMP/old"
            tar xf "$RUNNER_TEMP/final/monitoria-agent-linux-$ARCH-1.0.9.tar.gz" -C "$RUNNER_TEMP/new"
            bundle="monitoria-agent-linux-$ARCH"
            "$RUNNER_TEMP/new/$bundle/monitoria-agent" self-test
            sudo bash "$RUNNER_TEMP/old/$bundle/install.sh" </dev/null
            printf '%s\n' upgrade-state | sudo tee /var/lib/monitoria/upgrade-fixture.txt >/dev/null
            sudo bash "$RUNNER_TEMP/new/$bundle/install.sh" </dev/null
            sudo grep -qx upgrade-state /var/lib/monitoria/upgrade-fixture.txt
            sudo systemctl restart monitoria-agent.service
            systemctl is-active --quiet monitoria-agent.service
            status=''
            for attempt in {1..40}; do
              status="$(sudo -u monitoria /opt/monitoria/monitoria-agent status 2>/dev/null)" && break
              sleep 0.5
            done
            grep -F 'MonitorIA Agent v1.0.9' <<< "$status"
          ) >"$log" 2>&1
      - name: Sign manifest and stage Linux draft
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_SIGNING_KEY_B64: ${{ secrets.MONITORIA_AGENT_RELEASE_SIGNING_KEY_B64 }}
          TRUSTED_RELEASE_FINGERPRINT: ${{ vars.MONITORIA_AGENT_RELEASE_KEY_SHA256 }}
        run: bash tools/v109-stage-draft.sh linux-${{ matrix.arch }} "$RUNNER_TEMP/final"
      - if: always()
        run: rm -rf private-src
  android:
    needs: validate
    if: inputs.acknowledge_drafts && (inputs.channel == 'all' || inputs.channel == 'android')
    strategy:
      fail-fast: false
      matrix:
        include:
          - {channel: pdv, environment: android-private-signing, prefix: MONITORIA_ANDROID, version: 24, filename: MonitorIA-Android-PDV-0.2.22-private.apk}
          - {channel: conventional, environment: android-conventional-signing, prefix: MONITORIA_ANDROID_CONVENTIONAL, version: 2, filename: MonitorIA-Android-0.3.1.apk}
    runs-on: ubuntu-24.04
    environment: ${{ matrix.environment }}
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: BigCorps/MonitorIA
          ref: ${{ env.MONITORIA_SOURCE_SHA }}
          token: ${{ secrets.MONITORIA_PRIVATE_SOURCE_TOKEN }}
          path: private-src
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Validate, compile and sign with existing package certificate
        working-directory: private-src/android-agent
        env:
          CHANNEL: ${{ matrix.channel }}
          KEYSTORE: ${{ secrets[format('{0}_SIGNING_STORE_B64', matrix.prefix)] }}
          STORE_PASSWORD: ${{ secrets[format('{0}_STORE_PASSWORD', matrix.prefix)] }}
          KEY_ALIAS: ${{ secrets[format('{0}_KEY_ALIAS', matrix.prefix)] }}
          KEY_PASSWORD: ${{ secrets[format('{0}_KEY_PASSWORD', matrix.prefix)] }}
          EXPECTED_CERT_SHA256: ${{ vars[format('{0}_CERT_SHA256', matrix.prefix)] }}
          SIGNING_PREFIX: ${{ matrix.prefix }}
          VERSION: ${{ matrix.version }}
          FILENAME: ${{ matrix.filename }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MONITORIA_SOURCE_SHA"
          for binding in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_CERT_SHA256; do
            test -n "${!binding}" || { echo "::error::Missing protected $binding binding"; exit 1; }
          done
          umask 077
          key="$(mktemp)"
          log="$RUNNER_TEMP/v109-android-private.log"
          trap 'rm -f "$key" "$log"' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode > "$key"
          unset KEYSTORE
          trap 'echo "::error::Private Android validation or signing failed"' ERR
          (
            set -euo pipefail
            fingerprint="$(keytool -exportcert -keystore "$key" -alias "$KEY_ALIAS" -storepass:env STORE_PASSWORD | sha256sum | cut -d' ' -f1)"
            expected="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            test "$fingerprint" = "$expected"
            export "${SIGNING_PREFIX}_SIGNING_STORE=$key" "${SIGNING_PREFIX}_STORE_PASSWORD=$STORE_PASSWORD" "${SIGNING_PREFIX}_KEY_ALIAS=$KEY_ALIAS" "${SIGNING_PREFIX}_KEY_PASSWORD=$KEY_PASSWORD"
            unset STORE_PASSWORD KEY_ALIAS KEY_PASSWORD
            bash gradlew --no-daemon -PmonitoriaAndroidChannel="$CHANNEL" testDebugUnitTest lintDebug assembleRelease
            mkdir -p "$RUNNER_TEMP/final"
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/final/$FILENAME"
            MONITORIA_ANDROID_RELEASE_CHANNEL="$CHANNEL" python3 tools/verify-release.py "$RUNNER_TEMP/final/$FILENAME"
            jq -e --arg sha "$MONITORIA_SOURCE_SHA" --argjson version "$VERSION" '.sourceCommit == $sha and .versionCode == $version' "$RUNNER_TEMP/final/VERIFIED-RELEASE.json"
          ) >"$log" 2>&1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify signed APK installation and PDV upgrade on API 33
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        env:
          ANDROID_CHANNEL: ${{ matrix.channel }}
          EXPECTED_CERT_SHA256: ${{ vars[format('{0}_CERT_SHA256', matrix.prefix)] }}
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: cd private-src && bash scripts/verify-agent-v109-android-upgrade.sh > "$RUNNER_TEMP/v109-android-upgrade-private.log" 2>&1
      - name: Sign manifest and stage APK draft
        env:
          GH_TOKEN: ${{ github.token }}
          MANIFEST_SIGNING_KEY_B64: ${{ secrets.MONITORIA_AGENT_RELEASE_SIGNING_KEY_B64 }}
          TRUSTED_RELEASE_FINGERPRINT: ${{ vars.MONITORIA_AGENT_RELEASE_KEY_SHA256 }}
        run: bash tools/v109-stage-draft.sh android-${{ matrix.channel }} "$RUNNER_TEMP/final"
      - if: always()
        run: rm -rf private-src "$RUNNER_TEMP/v109-android-upgrade-private.log" "$RUNNER_TEMP/final"
