name: Protect 1.0 distribution preflight
on:
  push:
    branches: [ci/protect-100-distribution]
    paths: ['.github/workflows/protect-100-preflight.yml', 'tools/recover-protect-100.sh']
permissions:
  actions: read
  contents: read
jobs:
  preflight:
    if: github.repository == 'BigCorps/MonitorIA-Downloads'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Verify private access, bindings and preserved installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TOKEN: ${{ secrets.MONITORIA_PRIVATE_SOURCE_TOKEN }}
          PROTECT_QA_ARTIFACT_KEY: ${{ secrets.PROTECT_QA_ARTIFACT_KEY }}
          ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
        run: |
          set -euo pipefail
          missing=0
          for binding in SOURCE_TOKEN PROTECT_QA_ARTIFACT_KEY ESIGNER_USERNAME ESIGNER_PASSWORD ESIGNER_CREDENTIAL_ID ESIGNER_TOTP_SECRET; do
            if [[ -n "${!binding}" ]]; then echo "Available: $binding"
            else echo "::warning::Unavailable: $binding"; missing=1; fi
          done
          if [[ -n "$SOURCE_TOKEN" ]]; then
            test "$(GH_TOKEN="$SOURCE_TOKEN" gh api repos/BigCorps/MonitorIA --jq .private)" = true
            test "$(GH_TOKEN="$SOURCE_TOKEN" gh api repos/BigCorps/MonitorIA/commits/ddfbe813e9f876c7e3ede49e1ac29993a35dd803 --jq .sha)" = ddfbe813e9f876c7e3ede49e1ac29993a35dd803
            echo 'Authorized private source verified.'
          fi
          if [[ -n "$PROTECT_QA_ARTIFACT_KEY" ]]; then
            verified="$(mktemp -d)"
            trap 'rm -rf -- "$verified"' EXIT
            bash tools/recover-protect-100.sh "$verified"
          fi
          [[ "$missing" == 0 ]]
